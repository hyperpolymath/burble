# This workflow is managed by gh actions-lock.
name: OSSF Scorecard

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  scorecard:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@092dedada188f56c5915f74a5fd40aac093742c3
    permissions:
      contents: read
      security-events: write
      id-token: write
  pull-request-scorecard:
    name: Scorecard contribution scan
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false
      - uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: results.sarif
